name: Nightly

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check for existing nightly
        id: nightly
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
             git ls-remote --exit-code --tags origin "refs/tags/nightly.*.$(git rev-parse --short=12 HEAD)" >/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.nightly.outputs.build == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.nightly.outputs.build == 'true'
        run: flutter pub get

      - name: Test
        if: steps.nightly.outputs.build == 'true'
        run: flutter test

      - name: Verify signing secrets
        if: steps.nightly.outputs.build == 'true'
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}"
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build nightly APK
        if: steps.nightly.outputs.build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Prepare asset
        if: steps.nightly.outputs.build == 'true'
        run: |
          NIGHTLY_TAG="nightly.$(date -u +%Y%m%d).$(git rev-parse --short=12 HEAD)"
          echo "NIGHTLY_TAG=$NIGHTLY_TAG" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "learnkana-${NIGHTLY_TAG}.apk"
          git tag "$NIGHTLY_TAG" HEAD
          git push origin "$NIGHTLY_TAG"

      - name: Publish nightly release
        if: steps.nightly.outputs.build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NIGHTLY_TAG }}
          name: ${{ env.NIGHTLY_TAG }}
          prerelease: true
          files: learnkana-${{ env.NIGHTLY_TAG }}.apk
          make_latest: false
